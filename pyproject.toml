[project]
name = "dirtbike"
version = "0.1.0"
description = "Reverse-engineered Dirt Bike 4.3 physics harness and planner"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib", "tqdm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dirtbike"]
